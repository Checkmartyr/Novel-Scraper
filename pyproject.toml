[project]
name = "novel-scraping-agent"
version = "0.1.0"
description = "Agentic novel scraping system powered by Obscura, Gemini Interactions API, and Textual"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Master Mayoi" }
]
keywords = [
    "novel",
    "web-scraping",
    "agent",
    "gemini",
    "interactions-api",
    "obscura",
    "textual",
    "rich",
    "langchain"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "textual>=0.70.0",
    "rich>=13.7.0",
    "google-genai>=0.1.1",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "lxml>=5.2.0",
    "aiofiles>=24.1.0",
    "pykakasi>=2.3.0",
    "anyascii>=0.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
novel-scraper = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
